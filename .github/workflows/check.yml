name: Check specs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install truewire
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python truewire
      - name: Index matches the tree
        # Counts, status and the README table, all read off the tree. A spec whose
        # endpoints neither hold a recording nor declare `unverified` fails here, naming
        # the gate below it would have failed.
        run: .venv/bin/python scripts/check_index.py
      - name: The recorder writes what the checker checks
        # `record.py` rewrites the index and both README levels after a recording run;
        # `check_index.py` holds them to the tree. Refreshing every spec through the
        # recorder's own code on a clean tree must change nothing, or the two have drifted
        # and the next recording run would fail at its gate (2026-09-10, run 34477798994).
        run: |
          .venv/bin/python -c "import json, sys; sys.path.insert(0, 'scripts'); import record; record.refresh_index(sorted(json.load(open('registry.json'))['specs']))"
          git diff --exit-code
      - name: Check every spec
        # `standards` runs `check` and `examples --require-verified` and adds the four
        # spec-only rules a project without a `[python]` package can still be held to.
        run: |
          for spec in specs/*/; do
            echo "== $spec"
            .venv/bin/truewire check --project "$spec"
            .venv/bin/truewire standards --project "$spec" \
              --only check,examples,duplicate-schemas,secret-placeholders,router-coverage
          done

  recorded:
    # The strict half, kept separate so it can never be quietly satisfied by a declaration.
    # `examples --require-verified` excuses an endpoint that declares `unverified`, which
    # is right -- a call needing a credential this repository does not hold will never be
    # recorded here -- but it means a spec can pass the gate with no evidence at all. This
    # job fails a spec that claims `recorded`, and reports, without failing, every spec
    # still waiting on a recording run. Those are listed in the README as `unrecorded`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recording status
        run: python scripts/recording_status.py
